profiles:
  general-root:
    description: "Target production base: OSWorld-verified Ubuntu 22.04 GNOME desktop + UDA /v1 API."
    region: ap-southeast-1
    source: osworld-verified
    source_region: us-east-1
    source_ami_id: ami-0d23263edb96951d8
