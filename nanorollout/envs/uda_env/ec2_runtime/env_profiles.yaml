    launch_template_id: lt-03862713037af59fe
    launch_template_default_version: 9
    status: validated
    default_instance_type: t3.xlarge
    disk_gb: 80
    workspace_dir: /home/user
    task_workspace_dir: /tmp_workspace
    system_services:
      - gdm.service
      - osworld.service
      - websockify.service
      - uda-compat.service
    includes:
      - UDA /v1 compatibility API on port 8080
      - OSWorld GNOME desktop on DISPLAY=:0
      - Xorg auth via /run/user/1000/gdm/Xauthority
      - noVNC/x11vnc through OSWorld services
      - xdotool/scrot/gnome-screenshot/pyautogui computer-use controls
      - Google Chrome
      - Visual Studio Code
      - LibreOffice suite
      - Evince PDF reader plus poppler/qpdf/ghostscript PDF tools
      - GIMP
      - shell, file, Python, Node.js, media inspection tools

